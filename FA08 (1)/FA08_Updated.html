<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>FA08 全自动荧光免疫分析仪</title>
<style>/* FA08 Fluorescence Immunoassay Analyzer HMI — 800x600 */

:root {
  /* Brand — medical blue */
  --blue-900: #0B3C66;
  --blue-800: #0F4E85;
  --blue-700: #1464A5;
  --blue-600: #1E78BE;
  --blue-500: #2E86C1;
  --blue-300: #7FB2DC;
  --blue-100: #DCE8F2;
  --blue-050: #EEF4F9;

  --bg: #EEF2F6;
  --surface: #FFFFFF;
  --surface-alt: #F4F7FA;
  --surface-sunken: #E8EEF3;
  --border: #D6DEE6;
  --border-strong: #B7C3CE;
  --divider: #E6ECF2;

  --ink-900: #0F1C2B;
  --ink-800: #1F2A37;
  --ink-700: #334155;
  --ink-500: #5B6B7B;
  --ink-400: #7A8898;
  --ink-300: #A5B0BC;

  --ok:   #2E8B57;
  --ok-bg:#E6F3EC;
  --warn: #D08419;
  --warn-bg:#FBF1DF;
  --err:  #C0392B;
  --err-bg:#FBE6E3;
  --run:  #1E78BE;
  --run-bg:#DCE8F2;

  --radius: 6px;
  --radius-lg: 10px;
  --shadow-1: 0 1px 0 rgba(15,28,43,.04), 0 1px 2px rgba(15,28,43,.06);
  --shadow-2: 0 2px 4px rgba(15,28,43,.08), 0 8px 24px rgba(15,28,43,.08);

  --font: "PingFang SC","Microsoft YaHei","Noto Sans SC","Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-num: "SF Mono","Menlo","Consolas","Roboto Mono",monospace;
}

* { box-sizing: border-box; }
html, body { margin:0; padding:0; height:100%; }
body {
  background:#000;
  font-family: var(--font);
  color: var(--ink-800);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* Stage — 800x600 letterboxed on black */
.stage-wrap {
  position: fixed; inset: 0;
  display: grid; place-items: center;
  background: #000;
}
.stage {
  width: 800px; height: 600px;
  background: var(--bg);
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 0 1px #000, 0 10px 60px rgba(0,0,0,.6);
  transform-origin: center center;
}

/* Buttons */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  height: 36px; padding: 0 14px;
  border-radius: var(--radius);
  border: 1px solid var(--border-strong);
  background: #fff;
  color: var(--ink-800);
  font: 500 13px/1 var(--font);
  cursor: pointer;
  user-select: none;
  transition: background .12s, border-color .12s, transform .05s;
}
.btn:hover { background: var(--blue-050); border-color: var(--blue-500); }
.btn:active { transform: translateY(1px); }
.btn.primary {
  background: var(--blue-700); color:#fff; border-color: var(--blue-800);
}
.btn.primary:hover { background: var(--blue-800); }
.btn.success { background: var(--ok); color:#fff; border-color: #226B42; }
.btn.success:hover { background:#226B42; }
.btn.danger { background: var(--err); color:#fff; border-color: #8E2A20; }
.btn.warn { background: var(--warn); color:#fff; border-color:#A9671A; }
.btn.ghost { background: transparent; border-color: transparent; }
.btn.ghost:hover { background: var(--blue-050); border-color: var(--border); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12px; }
.btn.lg { height: 44px; padding: 0 18px; font-size: 14px; }
.btn:disabled { opacity:.45; cursor:not-allowed; }

/* Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
}
.card-hd {
  height: 32px;
  padding: 0 10px;
  display:flex; align-items:center; justify-content:space-between;
  border-bottom: 1px solid var(--divider);
  background: var(--surface-alt);
  border-radius: var(--radius) var(--radius) 0 0;
  font-size: 12px; color: var(--ink-700); font-weight:600;
}

/* Inputs */
.field {
  display:flex; flex-direction:column; gap:4px;
}
.field > label {
  font-size: 11px; color: var(--ink-500); font-weight:500;
}
.input {
  height: 32px;
  border: 1px solid var(--border-strong);
  border-radius: 4px;
  background: #fff;
  padding: 0 10px;
  font: 13px var(--font);
  color: var(--ink-800);
  outline:none;
}
.input:focus, .input.focus { border-color: var(--blue-600); box-shadow: 0 0 0 3px var(--blue-100); }
.input[readonly] { background: var(--surface-sunken); color: var(--ink-500); }

/* Status pill */
.pill {
  display:inline-flex; align-items:center; gap:4px;
  height: 20px; padding: 0 8px;
  border-radius: 10px;
  font-size: 11px; font-weight:600;
  background: var(--surface-sunken); color: var(--ink-700);
  border: 1px solid var(--border);
  white-space:nowrap;
}
.pill .dot { width:6px; height:6px; border-radius:50%; background: currentColor; }
.pill.ok   { color:#1E6B43; background: var(--ok-bg);   border-color:#BDDDC9; }
.pill.warn { color:#8A5A10; background: var(--warn-bg); border-color:#E7CFA1; }
.pill.err  { color:#8E2A20; background: var(--err-bg);  border-color:#EFC2BC; }
.pill.run  { color:#0F4E85; background: var(--run-bg);  border-color:#B4CCE1; }
.pill.idle { color: var(--ink-500); }

/* Scrollbars */
.scroll { overflow-y:auto; }
.scroll::-webkit-scrollbar { width: 8px; }
.scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 4px; }
.scroll::-webkit-scrollbar-track { background: transparent; }

/* Overlay / modals */
.overlay {
  position:absolute; inset:0;
  background: rgba(15,28,43,.42);
  display:flex; align-items:center; justify-content:center;
  z-index: 50;
}
.modal {
  background: #fff;
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-2);
  min-width: 420px;
  max-width: 740px;
  max-height: 540px;
  display:flex; flex-direction:column;
  overflow:hidden;
}
.modal-hd {
  height: 44px;
  padding: 0 14px;
  display:flex; align-items:center; justify-content:space-between;
  background: var(--blue-700); color:#fff;
  font-weight:600; font-size: 14px;
}
.modal-hd .x { cursor:pointer; font-size: 18px; opacity:.9; padding: 4px 8px; }
.modal-hd .x:hover { opacity:1; }
.modal-bd { padding: 14px; overflow:auto; }
.modal-ft {
  padding: 10px 14px;
  border-top: 1px solid var(--divider);
  background: var(--surface-alt);
  display:flex; justify-content:flex-end; gap: 8px;
}

/* Table */
.tbl { width:100%; border-collapse: collapse; font-size: 12px; }
.tbl th, .tbl td {
  padding: 8px 10px;
  text-align: left;
  border-bottom: 1px solid var(--divider);
}
.tbl thead th {
  background: var(--surface-alt);
  color: var(--ink-600);
  font-weight: 600;
  font-size: 11px;
  color: var(--ink-700);
  text-transform: none;
  position: sticky; top: 0; z-index: 1;
}
.tbl tbody tr:hover { background: var(--blue-050); }
.tbl tbody tr.selected { background: var(--blue-100); }
.tbl .num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* Checkbox */
.ck {
  width:16px; height:16px;
  border:1px solid var(--border-strong);
  border-radius: 3px;
  background: #fff;
  display:inline-grid; place-items:center;
  cursor:pointer;
  flex-shrink: 0;
}
.ck.on { background: var(--blue-700); border-color: var(--blue-800); }
.ck.on::after {
  content:''; width:9px; height:5px;
  border-left: 2px solid #fff; border-bottom: 2px solid #fff;
  transform: rotate(-45deg) translateY(-1px);
}

/* Utility */
.hstack { display:flex; align-items:center; }
.vstack { display:flex; flex-direction:column; }
.gap-4 { gap:4px; } .gap-6 { gap:6px; } .gap-8 { gap:8px; } .gap-10 { gap:10px; } .gap-12 { gap:12px; }
.grow { flex:1 1 auto; }
.muted { color: var(--ink-500); }
.mono { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.sep { height:1px; background: var(--divider); }
.vsep { width:1px; background: var(--divider); align-self: stretch; }

/* Focus ring */
.focusable:focus { outline: 2px solid var(--blue-500); outline-offset: 2px; }

/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--blue-100);
  border-top-color: var(--blue-700);
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

/* Marquee / subtle pulse */
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
.pulse { animation: pulse 1.6s ease-in-out infinite; }

/* Status ticker — seamless slow scroll */
@keyframes ticker {
  from { transform: translateX(0); }
  to   { transform: translateX(-50%); }
}

/* Running strip */
@keyframes stripe {
  from { background-position: 0 0; }
  to   { background-position: 20px 0; }
}
.running-strip {
  height: 3px; width:100%;
  background: repeating-linear-gradient(
    -45deg,
    var(--blue-600) 0 8px,
    var(--blue-300) 8px 16px
  );
  animation: stripe 1.2s linear infinite;
}
</style>
</head>

<script>

  window.addEventListener('resize',fitStage);fitStage();
</script>

<script type="text/babel">// Seed data & constants
const ASSAYS = [

</script>
<script type="text/babel">// Simple inline SVG icons — 16px grid
const Icon = ({ name, size = 16, color = 'currentColor', style }) => {
  const s = size;
  const stroke = { stroke: color, strokeWidth: 1.6, fill: 'none', strokeLinecap:'round', strokeLinejoin:'round' };
  const svgProps = { width: s, height: s, viewBox: '0 0 16 16', style };

  switch(name) {
    case 'play':
      return <svg {...svgProps}><path d="M4 3 L13 8 L4 13 Z" fill={color} stroke="none" /></svg>;
    case 'pause':
      return <svg {...svgProps}><rect x="4" y="3" width="3" height="10" fill={color} /><rect x="9" y="3" width="3" height="10" fill={color} /></svg>;
    case 'stop':
      return <svg {...svgProps}><rect x="3" y="3" width="10" height="10" fill={color} /></svg>;
    case 'alert':
      return <svg {...svgProps}><path d="M8 2 L14 13 L2 13 Z" {...stroke} /><path d="M8 6 L8 9.5" {...stroke}/><circle cx="8" cy="11.5" r=".8" fill={color}/></svg>;
    case 'bell':
      return <svg {...svgProps}><path d="M4 11 h8 v-1 c-.6 -.3 -1 -1 -1 -1.8 v-2.2 a3 3 0 0 0 -6 0 v2.2 c0 .8 -.4 1.5 -1 1.8 z" {...stroke}/><path d="M7 13 a1 1 0 0 0 2 0" {...stroke}/></svg>;
    case 'user':
      return <svg {...svgProps}><circle cx="8" cy="6" r="2.6" {...stroke}/><path d="M3 13 c1 -2.5 3 -3.6 5 -3.6 s4 1.1 5 3.6" {...stroke}/></svg>;
    case 'search':
      return <svg {...svgProps}><circle cx="7" cy="7" r="4" {...stroke}/><path d="M10 10 L13.5 13.5" {...stroke}/></svg>;
    case 'scan':
      return <svg {...svgProps}><path d="M3 6 V4 h2 M11 4 h2 v2 M3 10 v2 h2 M13 10 v2 h-2" {...stroke}/><path d="M2.5 8 H13.5" {...stroke}/></svg>;
    case 'add':
      return <svg {...svgProps}><path d="M8 3 V13 M3 8 H13" {...stroke}/></svg>;
    case 'minus':
      return <svg {...svgProps}><path d="M3 8 H13" {...stroke}/></svg>;
    case 'close':
      return <svg {...svgProps}><path d="M4 4 L12 12 M12 4 L4 12" {...stroke}/></svg>;
    case 'edit':
      return <svg {...svgProps}><path d="M3 13 L3 11 L10 4 L12 6 L5 13 Z" {...stroke}/></svg>;
    case 'trash':
      return <svg {...svgProps}><path d="M3 4 H13 M5 4 V3 H11 V4 M4 4 L5 13 H11 L12 4" {...stroke}/></svg>;
    case 'print':
      return <svg {...svgProps}><path d="M4 6 V3 H12 V6 M4 10 H3 V6 H13 V10 H12 M5 10 H11 V13 H5 Z" {...stroke}/></svg>;
    case 'export':
      return <svg {...svgProps}><path d="M3 13 H13 M8 3 V10 M5 7 L8 10 L11 7" {...stroke}/></svg>;
    case 'check':
      return <svg {...svgProps}><path d="M3 8.5 L6.5 12 L13 4.5" {...stroke} strokeWidth="2"/></svg>;
    case 'card':
      return <svg {...svgProps}><rect x="2" y="4" width="12" height="8" rx="1" {...stroke}/><path d="M2 7 H14" {...stroke}/></svg>;
    case 'tip':
      return <svg {...svgProps}><path d="M6 2 H10 V6 L8 13 L6 6 Z" {...stroke}/></svg>;
    case 'plate':
      return <svg {...svgProps}><rect x="2" y="3" width="12" height="10" rx="1" {...stroke}/><circle cx="5" cy="6" r=".7" fill={color}/><circle cx="8" cy="6" r=".7" fill={color}/><circle cx="11" cy="6" r=".7" fill={color}/><circle cx="5" cy="10" r=".7" fill={color}/><circle cx="8" cy="10" r=".7" fill={color}/><circle cx="11" cy="10" r=".7" fill={color}/></svg>;
    case 'flask':
      return <svg {...svgProps}><path d="M6 2 H10 V6 L13 12 a1 1 0 0 1 -1 1 H4 a1 1 0 0 1 -1 -1 L6 6 Z" {...stroke}/></svg>;
    case 'therm':
      return <svg {...svgProps}><path d="M8 2 a2 2 0 0 1 2 2 V9 a3 3 0 1 1 -4 0 V4 a2 2 0 0 1 2 -2 Z" {...stroke}/></svg>;
    case 'chart':
      return <svg {...svgProps}><path d="M2 12 L6 8 L9 10 L14 4" {...stroke}/></svg>;
    case 'settings':
      return <svg {...svgProps}><circle cx="8" cy="8" r="2" {...stroke}/><path d="M8 2 V4 M8 12 V14 M2 8 H4 M12 8 H14 M3.5 3.5 L5 5 M11 11 L12.5 12.5 M12.5 3.5 L11 5 M5 11 L3.5 12.5" {...stroke}/></svg>;
    case 'flask-small':
      return <svg {...svgProps}><path d="M7 2 H9 V5 L12 12 H4 L7 5 Z" {...stroke}/></svg>;
    case 'arrow-right':
      return <svg {...svgProps}><path d="M4 8 H12 M9 5 L12 8 L9 11" {...stroke}/></svg>;
    case 'chevron-down':
      return <svg {...svgProps}><path d="M4 6 L8 10 L12 6" {...stroke}/></svg>;
    case 'chevron-up':
      return <svg {...svgProps}><path d="M4 10 L8 6 L12 10" {...stroke}/></svg>;
    case 'chevron-right':
      return <svg {...svgProps}><path d="M6 4 L10 8 L6 12" {...stroke}/></svg>;
    case 'reset':
      return <svg {...svgProps}><path d="M3 8 a5 5 0 1 1 1.5 3.5" {...stroke}/><path d="M3 4 V8 H7" {...stroke}/></svg>;
    case 'refresh':
      return <svg {...svgProps}><path d="M3 8 a5 5 0 1 1 1.5 3.5 M3 4 V8 H7" {...stroke}/></svg>;
    case 'dot':
      return <svg {...svgProps}><circle cx="8" cy="8" r="3" fill={color}/></svg>;
    case 'eye':
      return <svg {...svgProps}><ellipse cx="8" cy="8" rx="5.5" ry="3.5" {...stroke}/><circle cx="8" cy="8" r="1.8" {...stroke}/></svg>;
    case 'lis':

<script type="text/babel">// Virtual on-screen keyboard — numeric + full QWERTY + Chinese-friendly (ASCII)
const KB_LAYOUTS = {
  num: [
    ['1','2','3'],
    ['4','5','6'],
    ['7','8','9'],
    ['-','0','.'],
  ],
  abc: [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['shift','z','x','c','v','b','n','m','back'],
  ],
};

const Keyboard = ({ mode = 'abc', target, onInput, onClose, value }) => {
  const [shift, setShift] = React.useState(false);
  const layout = mode === 'num' ? KB_LAYOUTS.num : KB_LAYOUTS.abc;

  const press = (key) => {
    if (key === 'shift') { setShift(s => !s); return; }
    if (key === 'back')  { onInput('__back'); return; }
    if (key === 'space') { onInput(' '); return; }
    onInput(shift && key.length === 1 ? key.toUpperCase() : key);
  };

  // Position: fixed within 800x600 stage (bottom sheet)
  const isNum = mode === 'num';
  const w = isNum ? 260 : 640;
  const h = isNum ? 220 : 220;

  return (
    <div style={{
      position:'absolute',
      left: isNum ? 'auto' : (800 - w) / 2,
      right: isNum ? 10 : 'auto',
      bottom: 68,
      width: w,
      background:'#fff',
      border: '1px solid var(--border-strong)',
      borderRadius: 8,
      boxShadow: '0 8px 24px rgba(15,28,43,.25)',
      zIndex: 80,
      padding: 8,
    }}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'2px 6px 6px'}}>
        <div style={{fontSize:11, color:'var(--ink-500)'}}>
          <Icon name="edit" size={11}/> 输入: <span className="mono" style={{color:'var(--ink-800)'}}>{value || '—'}</span>
        </div>
        <div style={{display:'flex', gap:4}}>
          <button className="btn sm" onClick={() => onInput('__clear')}>清空</button>
          <button className="btn sm" onClick={onClose}><Icon name="close" size={12}/> 关闭</button>
        </div>
      </div>
      <div style={{display:'flex', flexDirection:'column', gap:4}}>
        {layout.map((row, r) => (
          <div key={r} style={{display:'flex', gap:4, justifyContent:'center'}}>
            {row.map(k => {
              const isSpecial = k === 'shift' || k === 'back';
              return (
                <button
                  key={k}
                  onClick={() => press(k)}
                  style={{
                    flex: isSpecial ? '0 0 60px' : '1 1 0',
                    height: 36,
                    minWidth: 36,
                    border: '1px solid var(--border-strong)',
                    background: k === 'shift' && shift ? 'var(--blue-100)' : '#fff',
                    borderRadius: 4,
                    fontSize: 14,
                    fontFamily: 'var(--font-num)',
                    color: 'var(--ink-800)',
                    cursor: 'pointer',
                  }}
                >
                  {k === 'shift' ? '⇧' : k === 'back' ? '⌫' : (shift && k.length===1 ? k.toUpperCase() : k)}
                </button>
              );
            })}
          </div>
        ))}
        {!isNum && (
          <div style={{display:'flex', gap:4, justifyContent:'center'}}>
            <button onClick={() => press('space')} style={{flex:'1 1 0', height:36, border:'1px solid var(--border-strong)', borderRadius:4, background:'#fff', fontSize:12}}>空格</button>
            <button onClick={() => onInput('__enter')} style={{flex:'0 0 80px', height:36, border:'1px solid var(--blue-700)', borderRadius:4, background:'var(--blue-700)', color:'#fff', fontSize:12, fontWeight:600}}>确认</button>
          </div>
        )}
      </div>
    </div>
  );
};

window.Keyboard = Keyboard;
</script>

<script type="text/babel">// Top bar: tabs (left) + status strip (right) — single 44px row

    return () => clearInterval(id);
  }, []);
  const p = n => String(n).padStart(2, '0');
  // Time only — no date, no username
  return `${p(t.getHours())}:${p(t.getMinutes())}:${p(t.getSeconds())}`;
};

<script type="text/babel">// Bottom bar: compact read-only consumables + prominent card button + device controls
const BottomBar = ({
  consumables, device, onStart, onPause,
  scheduledCount, pendingCardCount, onAddCard
}) => {
  const canStart = device === 'idle' || device === 'paused';
  const canPause = device === 'running';

  const Chip = ({ icon, qty, capacity, label, warn, crit }) => {
    const color = crit ? '#C0392B' : warn ? '#D08419' : '#2E8B57';
    return (
      <div style={{
        display:'flex', alignItems:'center', gap:5,
        padding:'0 8px', height:38,
        background:'#fff', border:'1px solid var(--border)', borderRadius:4,
      }}>
        <Icon name={icon} size={14} color={color}/>
        <span style={{fontSize:10, color:'var(--ink-500)'}}>{label}</span>
        <span className="mono" style={{fontSize:13, fontWeight:700, color}}>
          {qty}<span style={{fontSize:9, fontWeight:400, color:'var(--ink-400)'}}>/{capacity}</span>
        </span>
      </div>
    );
  };

  const DChip = ({ d }) => {
    const loaded = d.loaded !== false;
    const pct = loaded && d.capacity > 0 ? Math.max(0, Math.min(1, d.qty / d.capacity)) : 0;
    const state = !loaded ? 'unloaded'
      : pct < 0.12 ? 'crit'
      : pct < 0.25 ? 'warn'
      : 'ok';
    const color = {
      unloaded: '#C5CCD4',
      crit:     '#E0574B',
      warn:     '#E8A33D',
      ok:       '#4CAF50',
    }[state];
    const trackColor = loaded ? '#E6EAEF' : '#EEF0F3';

    const R = 10, C = 2 * Math.PI * R;
    const dash = loaded ? C * pct : 0;

    return (
      <div style={{
        display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
        width:46, height:38, gap:1,
        background: loaded ? '#fff' : '#F5F6F8',
        border:'1px solid ' + (loaded ? 'var(--border)' : '#E0E3E7'),
        borderRadius:4,
      }} title={loaded ? `${d.name}  ${d.qty}/${d.capacity}` : `${d.name} 未装载`}>
        <svg width="22" height="22" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r={R} fill="none" stroke={trackColor} strokeWidth="2.5"/>
          {loaded ? (
            <circle cx="12" cy="12" r={R} fill="none"
              stroke={color} strokeWidth="2.5" strokeLinecap="round"
              strokeDasharray={`${dash} ${C}`}
              transform="rotate(-90 12 12)"/>
          ) : (
            <circle cx="12" cy="12" r={R} fill="none"
              stroke="#C5CCD4" strokeWidth="1" strokeDasharray="2 2.5"/>
          )}
          {state === 'unloaded' && (
            <text x="12" y="15" textAnchor="middle" fontSize="8" fill="#9AA4B0" fontWeight="700">—</text>
          )}
          {state === 'crit' && (
            <g>
              <path d="M12 8 V13" stroke={color} strokeWidth="1.8" strokeLinecap="round"/>
              <circle cx="12" cy="15.4" r="1" fill={color}/>
            </g>
          )}
          {(state === 'ok' || state === 'warn') && (
            <circle cx="12" cy="12" r="1.8" fill={color}/>
          )}
        </svg>
        <span style={{fontSize:9, fontWeight:700, color: loaded ? 'var(--ink-700)' : 'var(--ink-400)', lineHeight:1, letterSpacing:.3}}>
          {d.name}
        </span>
      </div>
    );
  };

  return (
    <div style={{
      height: 56,
      background: 'var(--surface-alt)',
      borderTop:'1px solid var(--border)',
      padding:'8px 10px',
      display:'flex', alignItems:'center', gap:6,
    }}>
      <Chip icon="tip" label="吸头"
        qty={consumables.tips.qty} capacity={consumables.tips.capacity}
        warn={consumables.tips.qty<20} crit={consumables.tips.qty<10}/>
      <Chip icon="plate" label="稀释板"
        qty={consumables.plate.qty} capacity={consumables.plate.capacity}
        warn={consumables.plate.qty<20} crit={consumables.plate.qty<10}/>
      {consumables.dilutions.map(d => <DChip key={d.slot} d={d}/>)}

      <div className="vsep" style={{height:28, margin:'0 6px'}}/>

      {/* Card queue — prominent */}
      <div onClick={onAddCard} style={{
        display:'flex', alignItems:'center', gap:8,
        padding:'0 14px', height:40,
        background: pendingCardCount>0 ? 'var(--warn-bg)' : '#fff',
        border:'1.5px solid '+(pendingCardCount>0 ? '#D08419' : 'var(--border-strong)'),
        borderRadius:5, cursor:'pointer',
      }}>
        <Icon name="card" size={18} color={pendingCardCount>0?'#8A5A10':'var(--blue-700)'}/>
        <span style={{fontSize:12, color:'var(--ink-700)', fontWeight:500}}>待加卡</span>
        <span className="mono" style={{fontSize:18, fontWeight:800,
          color: pendingCardCount>0 ? '#8A5A10' : 'var(--ink-800)'}}>{pendingCardCount}</span>
        <span style={{
          fontSize:13, padding:'6px 14px', background:'var(--blue-700)',
          color:'#fff', borderRadius:4, fontWeight:700, marginLeft:4,
        }}>加 卡</span>
      </div>

      <div style={{flex:1}}/>

      {/* Device controls */}
      <button className={'btn ' + (canStart ? 'success' : '')}
        disabled={!canStart || scheduledCount===0} onClick={onStart}
        style={{height:40, minWidth:96}}>
        <Icon name="play" size={13} color="currentColor"/> 启动检测
      </button>
      <button className={'btn ' + (canPause ? 'warn' : '')}
        disabled={!canPause} onClick={onPause}
        style={{height:40, minWidth:68}}>
        <Icon name="pause" size={11} color="currentColor"/> 暂停
      </button>
    </div>
  );
};

window.BottomBar = BottomBar;
</script>
<script type="text/babel">// Sample application form
const SampleForm = ({ slot, onSubmit, onCancel, onKeyboard, keyboardTarget, initial, nextSeq }) => {
  const [form, setForm] = React.useState(() => ({
    sampleId: initial?.sampleId || '',
    name:     initial?.name || '',
    gender:   initial?.gender || '男',
    age:      initial?.age || '',
    ageUnit:  initial?.ageUnit || '岁',
    type:     initial?.type || '血清',
    assays:   initial?.assays || [],
    assayCfg: initial?.assayCfg || {}, // { [code]: { repeat:1, dilution:1 } }
  }));
  const [expanded, setExpanded] = React.useState(null); // assay code currently expanded

  const update = (k, v) => setForm(f => ({...f, [k]: v}));
  const toggleAssay = (code) => {
    setForm(f => {
      const on = f.assays.includes(code);
      const assays = on ? f.assays.filter(c => c!==code) : [...f.assays, code];
      const assayCfg = {...f.assayCfg};
      if (!on && !assayCfg[code]) assayCfg[code] = { repeat: 1, dilution: 1 };
      return {...f, assays, assayCfg};
    });
  };
  const updateCfg = (code, key, val) => {
    setForm(f => ({
      ...f,
      assayCfg: {...f.assayCfg, [code]: {...(f.assayCfg[code] || {repeat:1, dilution:1}), [key]: val}}

  };

  const valid = form.sampleId && form.name && form.assays.length > 0;

        {/* Row 1 + Row 2: 合并为同一个 grid，共享列轨道，保证列宽完全对齐

<script type="text/babel">// Sample slot panel — single-column 8-slot rack (matching physical layout)
const SlotPanel = ({ slots, activeSlot, onSelectSlot, selected, onToggleSelect, onSelectAll, onRackChange }) => {
  const allSelected = slots.every(s => s.status === 'empty' || selected.includes(s.id));
  const nonEmptyCount = slots.filter(s => s.status !== 'empty').length;

  // Rack insertion state — toggled by test button (simulates microswitch signal)
  const [rackIn, setRackIn] = React.useState(true);

  const handleRackToggle = () => {
    const next = !rackIn;
    setRackIn(next);
    onRackChange?.(next);
  };

  return (
    <div style={{
      height:'100%', display:'flex', flexDirection:'column',
      background:'#fff', borderRight:'1px solid var(--border)',
    }}>
      {/* Header — click "样本位" to toggle rack state */}
      <div style={{
        padding:'8px 10px', borderBottom:'1px solid var(--divider)',
        background:'var(--surface-alt)',
        display:'flex', alignItems:'center', justifyContent:'space-between',
      }}>
        <div
          onClick={handleRackToggle}
          style={{fontSize:12, fontWeight:600, cursor:'pointer', userSelect:'none'}}
          title="点击模拟样本架插拔"
        >样本位</div>
        <div style={{display:'flex', gap:4, alignItems:'center', fontSize:10, color:'var(--ink-500)'}}>
          <span className={'ck' + (allSelected && nonEmptyCount>0 ?' on':'')}
            onClick={() => onSelectAll(!allSelected)} style={{width:13, height:13}}/>
          全选
        </div>
      </div>

      {/* Rack — single column, 8 slots */}
      <div style={{padding:'8px 8px', flex:1, display:'flex', flexDirection:'column', minHeight:0}}>
        <div style={{
          borderRadius:6,
          padding:'6px 6px',
          flex:1,
          display:'flex', flexDirection:'column', gap:4,
          minHeight:0,
          // B方案：仅改左边框颜色区分插入/取出，其余保持不变
          borderTop:    '2px solid var(--border-strong)',
          borderRight:  '2px solid var(--border-strong)',
          borderBottom: '2px solid var(--border-strong)',
          borderLeft:   rackIn ? '4px solid #2E8B57' : '4px solid var(--border-strong)',
          background:   'var(--surface-alt)',
          transition:   'border-left-color .35s ease',
        }}>
          {slots.map(s => {
            const isActive = activeSlot === s.id;
            const isSel = selected.includes(s.id);
            const statusLabel = {
              empty:'空闲', scheduled:'已编排', running:'检测中',
              done:'已完成', error:'异常',
            }[s.status];
            const isEmpty = s.status === 'empty';

            const TubeIcon = ({ filled }) => (
              <svg width="14" height="16" viewBox="0 0 14 16" style={{flexShrink:0}}>
                <path d="M3 1 H11 V4 L9.5 14 a1.5 1.5 0 0 1 -1.5 1.2 H6 a1.5 1.5 0 0 1 -1.5 -1.2 L3 4 Z"
                  fill={filled ? '#1E78BE' : '#fff'}
                  stroke={filled ? '#0F4E85' : '#A5B0BC'} strokeWidth="1.2"/>
                {filled && <path d="M4 9 L10 9" stroke="#fff" strokeWidth="1" opacity=".7"/>}
                <path d="M2.5 1 H11.5"
                  stroke={filled ? '#0F4E85' : '#A5B0BC'}
                  strokeWidth="1.4" strokeLinecap="round"/>
              </svg>
            );

            return (
              <div key={s.id}
                onClick={() => onSelectSlot(s.id)}
                style={{
                  position:'relative', flex:1,
                  border: '1.5px solid ' + (isActive ? 'var(--blue-700)' : 'var(--border-strong)'),
                  borderRadius:4,
                  background: isActive ? 'var(--blue-100)' : '#fff',
                  cursor:'pointer',
                  padding:'2px 6px',
                  display:'flex', alignItems:'center', gap:6,
                  boxShadow: isActive ? '0 0 0 2px var(--blue-100)' : 'none',
                  minHeight:0,
                }}>
                <TubeIcon filled={!isEmpty}/>
                <span className="mono" style={{
                  fontSize:13, fontWeight:800, flexShrink:0,
                  color: isActive ? 'var(--blue-800)' : 'var(--ink-800)',
                  minWidth:22,
                }}>{s.id}</span>
                <span style={{
                  flex:1, textAlign:'right',
                  fontSize:10, fontWeight:600,
                  color: isEmpty ? 'var(--ink-400)' :
                         s.status==='error' ? '#C0392B' :
                         s.status==='done'  ? '#2E8B57' :
                                              'var(--blue-700)',
                }}>{statusLabel}</span>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
};

window.SlotPanel = SlotPanel;
</script>

  onSubmitForm, onCancelForm,
  onEdit, onDelete, onNew,

          slots={slots}

            onNew={onNew}
          />
        )}

    </div>
  );
};

window.DetectPage = DetectPage;

<script type="text/babel">// Results page: filter + sample-grouped list + curve detail
const PAGE_SIZE = 3; // rows per page

const RESULT_PAGE_SIZE = 10;

const ResultsPage = ({ results }) => {
  const [selectedIds, setSelectedIds] = React.useState([]);
  const [date, setDate] = React.useState('2026-04-18');
  const [detailRow, setDetailRow] = React.useState(null); // { seq, sample, item, tcRatio, tVal, cVal }
  const [page, setPage] = React.useState(1);

  // 把 results 拍平为独立行，每 item 一行；seq 从 1 开始正序（最旧=1，最新=N）
  const allFlat = React.useMemo(() => {
    let seq = 0;
    return results.flatMap(r =>
      r.items.map(it => {
        seq++;
        const seed = seq * 137 + it.code.charCodeAt(0);
        const tVal     = 1000 + (seed * 31) % 4000;
        const cVal     = 2000 + (seed * 17) % 3000;
        const tcRatio  = (tVal / cVal).toFixed(3);
        // 线位置（单位 pixel，范围 80-160）
        const cPos     = 80  + (seed * 11) % 80;
        const tPos     = 160 + (seed * 7)  % 80;
        // 预设位置（在实际位置基础上 ±5px 偏差）
        const cPreset  = cPos + ((seed % 7) - 3);
        const tPreset  = tPos + ((seed % 5) - 2);
        return {
          rowId: `${r.id}-${it.code}-${seq}`,
          seq: String(seq),
          sample: r,
          item: it,
          tVal, cVal, tcRatio,
          cPos, tPos, cPreset, tPreset,
        };
      })
    );
  }, [results]);

  // 按日期筛选；倒序展示（最新在最上方，序号最大的先显示）
  const filtered = allFlat.filter(row => !date || row.sample.time.startsWith(date)).slice().reverse();

  // 分页
  const totalPages = Math.max(1, Math.ceil(filtered.length / RESULT_PAGE_SIZE));
  const safePage   = Math.min(page, totalPages);
  const pageRows   = filtered.slice((safePage - 1) * RESULT_PAGE_SIZE, safePage * RESULT_PAGE_SIZE);

  React.useEffect(() => { setPage(1); }, [date]);

  // 选择（点击行切换，支持多选）
  const toggleSel = (rowId) =>
    setSelectedIds(s => s.includes(rowId) ? s.filter(x => x !== rowId) : [...s, rowId]);
  const allPageSelected = pageRows.length > 0 && pageRows.every(r => selectedIds.includes(r.rowId));
  const toggleAllPage   = () => {
    if (allPageSelected) setSelectedIds(s => s.filter(id => !pageRows.find(r => r.rowId === id)));
    else setSelectedIds(s => [...new Set([...s, ...pageRows.map(r => r.rowId)])]);
  };
  const hasSelected = selectedIds.length > 0;

  return (
    <div style={{flex:1, display:'flex', flexDirection:'column', padding:8, gap:8, minHeight:0, background:'var(--bg)'}}>

      {/* ── 筛选栏 ── */}
      <div style={{background:'#fff', border:'1px solid var(--border)', borderRadius:6,
        padding:'7px 10px', display:'flex', alignItems:'center', gap:8, flexShrink:0}}>
        <div style={{display:'flex', alignItems:'center', gap:6, fontSize:12}}>
          <span style={{color:'var(--ink-500)'}}>日期</span>
          <input type="date" className="input" style={{width:132, height:28, fontSize:12}}
            value={date} onChange={e => setDate(e.target.value)}/>
        </div>
        <button className="btn sm"><Icon name="search" size={11}/> 更多查找</button>
        <div style={{flex:1}}/>
        <div className="vsep" style={{height:20}}/>
        <button className="btn sm" disabled={!hasSelected}><Icon name="print"  size={11}/> 打印</button>
        <button className="btn sm" disabled={!hasSelected}><Icon name="export" size={11}/> 导出</button>
        <button className="btn sm" disabled={!hasSelected}><Icon name="trash"  size={11}/> 删除</button>
        <button className="btn sm" onClick={() => setSelectedIds([])}><Icon name="close" size={11}/> 清空</button>
      </div>

      {/* ── 结果列表 ── */}
      {/* 共享列定义：header 和 data 行完全用同一份 COLS，保证像素级对齐 */}
      {(() => {
        const COLS = [
          { key:'seq',    label:'序号',     w:30, align:'center' },
          { key:'id',     label:'样本ID',   w:60, align:'left'   },
          { key:'pos',    label:'位置',     w:24, align:'center' },
          { key:'code',   label:'项目',     w:60, align:'left'   },
          { key:'result', label:'结果',     w:52, align:'left'   },
          { key:'concl',  label:'结论',     w:45, align:'center' },
          { key:'time',   label:'完成时间', w:45, align:'center' },
          { key:'detail', label:'详情',     w:44, align:'center' },
        ];
        // 单元格公共样式：flex-grow:1 使各列等额分配剩余空间作为间隔
        const cellStyle = (col, extra) => ({
          flex: `1 0 ${col.w}px`,
          minWidth: col.w,
          padding:'0 4px',
          display:'flex', alignItems:'center',
          justifyContent: col.align === 'center' ? 'center' : 'flex-start',
          overflow:'hidden',
          whiteSpace:'nowrap',
          ...extra,
        });
        return (
          <div style={{flex:1, background:'#fff', border:'1px solid var(--border)', borderRadius:6,
            display:'flex', flexDirection:'column', minHeight:0, overflow:'hidden'}}>

            {/* 表头 */}
            <div style={{display:'flex', alignItems:'center', height:32, background:'var(--surface-alt)',
              borderBottom:'1px solid var(--border)', flexShrink:0, padding:'0 4px'}}>
              {/* 全选勾选框 */}
              <div style={{width:30, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', height:32}}>
                <span className={'ck'+(allPageSelected?' on':'')}
                  onClick={e => { e.stopPropagation(); toggleAllPage(); }}/>
              </div>
              {COLS.map(col => (
                <div key={col.key} style={cellStyle(col, {fontSize:11, fontWeight:600, color:'var(--ink-600)', height:32, overflow:'visible'})}>
                  {col.label}
                </div>
              ))}
            </div>

            {/* 数据行 */}
            <div className="scroll" style={{flex:1}}>
              {pageRows.length === 0 ? (
                <div style={{padding:40, textAlign:'center', color:'var(--ink-400)', fontSize:12}}>暂无结果</div>
              ) : pageRows.map(row => {
                const { rowId, seq, sample: r, item: it } = row;
                const sel   = selectedIds.includes(rowId);
                const isPos = it.concl === '阳性';
                return (
                  <div key={rowId} onClick={() => toggleSel(rowId)} style={{
                    display:'flex', alignItems:'center', height:36,
                    padding:'0 4px', cursor:'pointer',
                    borderBottom:'1px solid var(--divider)',
                    background: sel ? 'var(--blue-050)' : '#fff',
                    transition:'background .1s',
                  }}>
                    {/* 勾选框 */}
                    <div style={{width:30, flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', height:36}}>
                      <span className={'ck'+(sel?' on':'')}
                        onClick={e => { e.stopPropagation(); toggleSel(rowId); }}/>
                    </div>
                    {/* 序号 */}
                    <div style={cellStyle(COLS[0], {height:36})}>

                    {/* 3列表：行标签 | T列 | C列 */}

                      <div style={{textAlign:'center', fontSize:11, fontWeight:700, color:'var(--blue-700)', padding:'2px 0'}}>C</div>
                      {/* 数值 */}

                      <div style={{background:'var(--surface-alt)', borderRadius:3, padding:'3px 0', textAlign:'center'}}>

                      </div>
                      <div style={{background:'var(--surface-alt)', borderRadius:3, padding:'3px 0', textAlign:'center'}}>

                    </div>
                  </div>

                  {/* ┌─── Row 1, Col 1：检测结果（与T/C比值行自动对齐）───┐ */}
                  <div style={{padding:'10px 14px 14px', display:'flex', flexDirection:'column', gap:7}}>

                    <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:'7px 8px'}}>

window.ResultsPage = ResultsPage;
</script>
<script type="text/babel">
// Consumables management page
const ConsumablesPage = ({ consumables, cards, onReplace, onLoadDilution }) => {
  // 稀释液内联展开
  const [dilutionExpand, setDilutionExpand] = React.useState(null);
  const [dilutionBarcode, setDilutionBarcode] = React.useState('');
  const [unloadConfirm, setUnloadConfirm] = React.useState(null); // index → 卸载确认弹窗

  // 耗材内联展开
  const [consumableExpand, setConsumableExpand] = React.useState(null);
  const [consumableQty, setConsumableQty] = React.useState('');

  // 项目标曲
  const [calPage, setCalPage] = React.useState(0);
  const [calSelected, setCalSelected] = React.useState([]);
  const [showImport, setShowImport] = React.useState(false);
  const [importBarcode, setImportBarcode] = React.useState('');
  const [importParsed, setImportParsed] = React.useState(null); // { name, batch, expire }
  const [importScanning, setImportScanning] = React.useState(true); // true=等待扫码, false=已解析
  const PAGE_SIZE = 5;

  const CALIBRATIONS = [
    { code:'CRP',      name:'CRP',       batch:'CRP251101',  expire:'20271105' },
    { code:'PCT',      name:'PCT',       batch:'PCT251102',  expire:'20271015' },
    { code:'NTproBNP', name:'NT-proBNP', batch:'NT251201',   expire:'20271201' },
    { code:'TnI',      name:'TnI',       batch:'TnI251103',  expire:'20271120' },
    { code:'Myo',      name:'Myo',       batch:'Myo251104',  expire:'20271118' },
  ];

  const totalPages = Math.max(1, Math.ceil(CALIBRATIONS.length / PAGE_SIZE));
  const pageItems  = CALIBRATIONS.slice(calPage * PAGE_SIZE, (calPage + 1) * PAGE_SIZE);
  const allPageSel = pageItems.length > 0 && pageItems.every(it => calSelected.includes(it.code));

  const toggleCalSelect = (code) =>
    setCalSelected(p => p.includes(code) ? p.filter(c => c !== code) : [...p, code]);
  const toggleCalAll = () =>
    setCalSelected(allPageSel ? calSelected.filter(c => !pageItems.find(i=>i.code===c)) : [...new Set([...calSelected, ...pageItems.map(i=>i.code)])]);

  /* ── 共用进度条 ── */
  const Bar = ({ pct, color }) => (
    <div style={{height:6, background:'var(--surface-sunken)', borderRadius:3, overflow:'hidden'}}>
      <div style={{height:'100%', width: Math.min(100,pct)+'%', background:color, borderRadius:3, transition:'width .3s'}}/>
    </div>
  );

  const statusOf = (qty, cap) => {
    const pct = qty / cap * 100;
    if (pct < 10) return { color:'#C0392B' };
    if (pct < 25) return { color:'#D08419' };
    return { color:'#2E8B57' };
  };

  /* ── 稀释液更换确认 ── */
  const handleDilutionConfirm = (i) => {
    const barcode = dilutionBarcode.trim();
    if (!barcode) { setUnloadConfirm(i); return; }          // 空条码 → 卸载确认
    const parts = barcode.split(',');
    const data = {
      name:       parts[1] || consumables.dilutions[i].name,
      batch:      parts[2] || '',
      spec:       parts[3] || String(consumables.dilutions[i].capacity),
      expireDate: parts[5] || '',
    };
    onLoadDilution(i, 'load', data);
    setDilutionExpand(null);
    setDilutionBarcode('');
  };

  const handleUnload = () => {
    onLoadDilution(unloadConfirm, 'unload');
    setUnloadConfirm(null);
    setDilutionExpand(null);
    setDilutionBarcode('');
  };

  /* ── 耗材更换确认 ── */
  const handleConsumableConfirm = (key) => {
    const qty = parseInt(consumableQty, 10);
    if (!isNaN(qty) && qty >= 0) onReplace(key, qty);
    setConsumableExpand(null);
    setConsumableQty('');
  };

  /* ── 展开帮助函数 ── */
  const openDilution = (i) => {
    setDilutionExpand(dilutionExpand === i ? null : i);
    setDilutionBarcode('');
  };
  const openConsumable = (key, cap) => {
    setConsumableExpand(consumableExpand === key ? null : key);
    setConsumableQty(String(cap));
  };

  return (
    <div style={{flex:1, display:'flex', margin:8, minHeight:0, background:'var(--surface-alt)',
      border:'1px solid var(--border)', borderRadius:6, overflow:'hidden'}}>

      {/* ══════ 左栏：项目标曲 50% ══════ */}
      <div style={{flex:'0 0 50%', display:'flex', flexDirection:'column',
        borderRight:'1px solid var(--border)', background:'#fff'}}>

        {/* 标题 */}
        <div style={{padding:'9px 12px', fontWeight:700, fontSize:13, color:'var(--ink-800)',
          borderBottom:'1px solid var(--border)', flexShrink:0}}>
          项目标曲
        </div>

        {/* 表格 */}
        <div style={{flex:1, overflow:'hidden'}}>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:12}}>
            <thead>
              <tr style={{background:'var(--surface-alt)'}}>
                <th style={{width:34, padding:'7px 8px', textAlign:'center'}}>
                  {/* 全选框 */}
                  <span onClick={toggleCalAll} style={{
                    display:'inline-flex', alignItems:'center', justifyContent:'center',
                    width:15, height:15, borderRadius:3, cursor:'pointer',
                    border:'1.5px solid '+(allPageSel ? 'var(--blue-700)' : 'var(--border-strong)'),
                    background: allPageSel ? 'var(--blue-700)' : '#fff',
                    color:'#fff', fontSize:10, fontWeight:900,
                  }}>{allPageSel ? '✓' : ''}</span>
                </th>
                <th style={{padding:'7px 8px', textAlign:'left', fontWeight:600, color:'var(--ink-700)'}}>项目名称</th>
                <th style={{padding:'7px 8px', textAlign:'left', fontWeight:600, color:'var(--ink-700)'}}>批次</th>
                <th style={{padding:'7px 8px', textAlign:'left', fontWeight:600, color:'var(--ink-700)'}}>失效日期</th>
              </tr>
            </thead>
            <tbody>
              {pageItems.map(item => {
                const isSel = calSelected.includes(item.code);
                return (
                  <tr key={item.code}
                    onClick={() => toggleCalSelect(item.code)}
                    style={{
                      borderTop:'1px solid var(--border)', cursor:'pointer',
                      background: isSel ? 'var(--blue-050)' : '',
                      transition:'background .1s',
                    }}>
                    <td style={{textAlign:'center', padding:'9px 8px'}}>
                      <span style={{
                        display:'inline-flex', alignItems:'center', justifyContent:'center',
                        width:15, height:15, borderRadius:3,
                        border:'1.5px solid '+(isSel ? 'var(--blue-700)' : 'var(--border-strong)'),
                        background: isSel ? 'var(--blue-700)' : '#fff',
                        color:'#fff', fontSize:10, fontWeight:900,
                      }}>{isSel ? '✓' : ''}</span>
                    </td>
                    <td style={{padding:'9px 8px', fontWeight:600, color: isSel?'var(--blue-800)':'var(--ink-800)'}}>{item.name}</td>
                    <td style={{padding:'9px 8px', fontFamily:'monospace', fontSize:11, color:'var(--ink-600)'}}>{item.batch}</td>
                    <td style={{padding:'9px 8px', fontFamily:'monospace', fontSize:11, color:'var(--ink-600)'}}>{item.expire}</td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>

        {/* 底部：操作 + 翻页 */}
        <div style={{borderTop:'1px solid var(--border)', padding:'7px 10px',
          display:'flex', alignItems:'center', gap:5, flexShrink:0}}>
          <button className="btn sm" style={{fontSize:12}}
            onClick={() => { setShowImport(true); setImportBarcode(''); setImportParsed(null); setImportScanning(true); }}>导入</button>
          <button className="btn sm" style={{fontSize:12}}
            disabled={calSelected.length === 0}
            onClick={() => { /* 删除逻辑 */ setCalSelected([]); }}>删除</button>
          <button className="btn sm" style={{fontSize:12}}
            onClick={() => setCalSelected([])}>清空</button>
          <div style={{flex:1}}/>
          <button className="btn sm" disabled={calPage===0}
            onClick={() => setCalPage(p=>p-1)} style={{fontSize:12, padding:'3px 8px'}}>上页</button>
          <span style={{fontSize:11, color:'var(--ink-500)', minWidth:36, textAlign:'center'}}>
            {calPage+1} / {totalPages}
          </span>
          <button className="btn sm" disabled={calPage>=totalPages-1}
            onClick={() => setCalPage(p=>p+1)} style={{fontSize:12, padding:'3px 8px'}}>下页</button>
        </div>
      </div>

      {/* ══════ 右栏：库存 50% ══════ */}
      <div style={{flex:'0 0 50%', display:'flex', flexDirection:'column', overflow:'hidden',
        padding:'8px', gap:8}}>

        {/* ── 稀释液库存 分块 ── */}
        <div style={{background:'#fff', borderRadius:6, border:'1px solid var(--border)',
          display:'flex', flexDirection:'column', flex:'0 0 auto'}}>
          <div style={{fontSize:12, fontWeight:700, color:'var(--ink-700)',
            padding:'7px 10px 5px', borderBottom:'1px solid var(--border)'}}>稀释液库存</div>
          <div style={{display:'flex', flexDirection:'column', gap:0}}>
            {consumables.dilutions.map((d, i) => {
              const st = statusOf(d.qty, d.capacity);
              const expanded = dilutionExpand === i;
              const isLast = i === consumables.dilutions.length - 1;
              return (
                <div key={d.slot} style={{
                  borderBottom: isLast ? 'none' : '1px solid var(--border)',
                  overflow:'hidden',
                }}>
                  {/* 主行 */}
                  <div style={{display:'flex', alignItems:'center', padding:'7px 10px', gap:8}}>
                    <Icon name="flask" size={16} color={st.color}/>

<script type="text/babel">// Modal: Add card dialog
const AddCardModal = ({ cards, neededByCode, onClose, onConfirm }) => {
  const [selected, setSelected]       = React.useState(null);
  const [selectedBatch, setSelectedBatch] = React.useState({});
  const [scanned, setScanned]         = React.useState(null); // { code, barcode }
  const [loadingCode, setLoadingCode] = React.useState(null);
  const [progress, setProgress]       = React.useState(0);
  const [doneCount, setDoneCount]     = React.useState(0);
  const timerRef = React.useRef(null);

  React.useEffect(() => () => clearInterval(timerRef.current), []);

  const totalNeeded = Object.values(neededByCode).reduce((a,b) => a+b, 0);
  const codes = Object.keys(neededByCode);
  const isLoading = !!loadingCode;

  // MYO has 3 batches; other items have no pre-defined batches (single LOT from cards data)
  const BATCHES = {
    MYO: [
      { lot: '241101', exp: '2026-06', cards: 8  },
      { lot: '241102', exp: '2026-09', cards: 12 },
      { lot: '241103', exp: '2026-12', cards: 6  },
    ],
  };

  // Manual row select (single-select only)
  const handleSelect = (code) => {
    if (isLoading) return;
    if (selected === code) { setSelected(null); setScanned(null); return; }
    setScanned(null);
    setSelected(code);
  };

  // Pick a specific batch — also collapses the picker and shows lot in card
  const handleBatchSelect = (code, lot) => {
    setSelectedBatch(p => ({ ...p, [code]: lot }));
  };

  // Barcode scanner hook (called by real scanner event; no demo UI)
  const simulateScan = (code) => {
    if (isLoading) return;
    const suffix = String(Math.floor(Math.random()*9000+1000));
    const barcode = code + '-' + (BATCHES[code] ? BATCHES[code][1].lot : 'LOT001') + '-B' + suffix;
    setScanned({ code, barcode });
    setSelected(code);
  };

  // Load button: 5-second progress bar, single-click lock
  const handleLoad = () => {
    if (!selected || isLoading) return;
    const code = selected;
    setLoadingCode(code);
    setProgress(0);
    let p = 0;
    timerRef.current = setInterval(() => {
      p += 2;
      setProgress(p);
      if (p >= 100) {
        clearInterval(timerRef.current);
        timerRef.current = null;
        setLoadingCode(null);
        setProgress(0);
        setDoneCount(c => c + 1);
        onConfirm({ [code]: 1 });
        setSelected(null);
        setScanned(null);
      }
    }, 100);
  };

  /* ── 单张项目卡片 ── */
  const ItemCard = ({ code }) => {
    const need          = neededByCode[code];
    const isSel         = selected === code;
    const isScanned     = scanned && scanned.code === code;
    const batches       = BATCHES[code] || null;
    const hasMultiBatch = batches && batches.length > 1;
    // 展开批次选择：选中 + 非扫码 + 有多批次
    const expandBatch   = isSel && !isScanned && hasMultiBatch;
    // 选中的批次号：手动选了就用手动的，否则 null（不预选）
    const selLot        = selectedBatch[code] || null;
    const isThisLoading = loadingCode === code;

    return (
      <div style={{marginBottom:6}}>
        {/* ── 主卡片 ── */}
        <div
          onClick={() => handleSelect(code)}
          style={{
            display:'flex', alignItems:'center',
            padding:'10px 14px',
            borderRadius:10,
            border:'2px solid '+(isSel ? 'var(--blue-700)' : 'var(--border)'),
            background: isSel ? 'var(--blue-050)' : '#fff',
            cursor: isLoading ? 'not-allowed' : 'pointer',
            transition:'border-color .13s, background .13s',
            userSelect:'none',
          }}>

          {/* 左：项目代码 */}
          <span style={{
            fontSize:16, fontWeight:800,
            color: isSel ? 'var(--blue-800)' : 'var(--ink-800)',
            width:64, flexShrink:0, letterSpacing:.3,
          }}>{code}</span>

          {/* 中：LOT 批号 — 居中显示 */}
          <div style={{flex:1, display:'flex', alignItems:'center', justifyContent:'center', gap:6}}>
            {isThisLoading ? (
              <span style={{fontSize:11, color:'var(--ok)', fontWeight:600, letterSpacing:.3}}>加卡中…</span>
            ) : isScanned ? (
              <>
                <span style={{
                  padding:'2px 6px', borderRadius:4,
                  background:'#E6F7EC', color:'#1A8A3C',
                  fontSize:10, fontWeight:700, letterSpacing:.4, flexShrink:0,
                }}>SCAN</span>
                <span style={{
                  fontFamily:'monospace', fontSize:11, color:'#1A8A3C', fontWeight:600,
                  overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:160,
                }}>{scanned.barcode}</span>
              </>
            ) : selLot ? (
              /* 已选批次 → 显示批号 */
              <>
                <span style={{
                  padding:'2px 7px', borderRadius:4,
                  background:'var(--blue-100)', color:'var(--blue-700)',
                  fontSize:10, fontWeight:700, letterSpacing:.5, flexShrink:0,
                }}>LOT</span>
                <span className="mono" style={{fontSize:12, color:'var(--blue-700)', fontWeight:700}}>
                  {selLot}
                </span>
              </>
            ) : (
              /* 未选批次 → 灰色占位 */
              <>
                <span style={{
                  padding:'2px 7px', borderRadius:4,
                  background:'var(--surface-sunken)', color:'var(--ink-400)',
                  fontSize:10, fontWeight:700, letterSpacing:.5, flexShrink:0,
                }}>LOT</span>
                <span style={{fontSize:11, color:'var(--ink-300)'}}>
                  {isSel && hasMultiBatch ? '请选择批次' : '—'}
                </span>
              </>
            )}
          </div>

          {/* 右：待加数量 */}
          <div style={{flexShrink:0, display:'flex', alignItems:'center', gap:4}}>
            <span style={{fontSize:11, color:'var(--ink-500)'}}>待加</span>
            <span className="mono" style={{
              fontSize:15, fontWeight:800,
              color: isSel ? 'var(--blue-700)' : 'var(--ink-700)',
            }}>{need}</span>
            <span style={{fontSize:11, color:'var(--ink-500)'}}>张</span>
          </div>
        </div>

        {/* ── 批次下拉展开（CSS max-height 动画） ── */}
        <div style={{
          overflow:'hidden',
          maxHeight: expandBatch ? (batches.length * 56 + 12) + 'px' : '0px',
          transition:'max-height .25s ease',
        }}>
          <div style={{
            marginTop:4, marginLeft:10, marginRight:2,
            paddingLeft:10,
            borderLeft:'2px solid var(--blue-200)',
            display:'flex', flexDirection:'column', gap:5,
            paddingBottom:2,
          }}>
            {(batches || []).map(b => {
              const bSel = selLot === b.lot;
              return (
                <div key={b.lot}
                  onClick={e => { e.stopPropagation(); handleBatchSelect(code, b.lot); }}
                  style={{
                    display:'flex', alignItems:'center', gap:10,
                    padding:'7px 12px',
                    borderRadius:8,
                    border:'1.5px solid '+(bSel ? 'var(--blue-700)' : 'var(--border)'),
                    background: bSel ? 'var(--blue-050)' : '#F8FAFB',
                    cursor:'pointer',
                    transition:'border-color .1s, background .1s',
                  }}>
                  {/* 单选圆钮 */}
                  <span style={{
                    width:13, height:13, borderRadius:'50%', flexShrink:0,
                    border:'1.5px solid '+(bSel ? 'var(--blue-700)' : 'var(--border-strong)'),
                    background: bSel ? 'var(--blue-700)' : '#fff',
                    display:'inline-block',
                    transition:'background .1s, border-color .1s',
                  }}/>
                  <span className="mono" style={{
                    fontWeight:700, fontSize:13, letterSpacing:.4,
                    color: bSel ? 'var(--blue-800)' : 'var(--ink-800)',
                    flex:1,
                  }}>{b.lot}</span>
                  <span style={{fontSize:10, color:'var(--ink-400)'}}>有效期 {b.exp}</span>
                  <span style={{fontSize:10, color:'var(--ink-500)', marginLeft:6}}>库存 {b.cards} 张</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>
    );
  };

  return (
    <div className="overlay">
      <div className="modal" style={{width: 460}}>
        <div className="modal-hd">
          <div><Icon name="card" size={14}/> 加载试剂卡</div>
          <span className="x"
            onClick={isLoading ? undefined : onClose}
            style={{cursor: isLoading ? 'not-allowed' : 'pointer', opacity: isLoading ? 0.35 : 1}}>×</span>
        </div>

        <div className="modal-bd" style={{paddingBottom:4}}>

          {/* ── 统计行 ── */}
          <div style={{
            display:'flex', alignItems:'center', justifyContent:'space-between',
            fontSize:13, color:'var(--ink-600)',
            marginBottom:12,
          }}>
            <span>待加卡总数：</span>
            <span>
              <b className="mono" style={{fontSize:18, fontWeight:800, color:'var(--blue-700)'}}>{totalNeeded}</b>
              <span style={{fontSize:12, marginLeft:3, color:'var(--ink-500)'}}>张</span>
            </span>
          </div>

          {/* ── 项目卡片列表 ── */}
          <div style={{maxHeight:260, overflowY:'auto', paddingRight:2}}>
            {codes.map(code => <ItemCard key={code} code={code}/>)}
          </div>

          {/* ── 操作提示 ── */}
          <div style={{
            display:'flex', alignItems:'center', justifyContent:'center',
            gap:6, fontSize:11, color:'#7A5C0A',
            padding:'8px 12px', marginTop:6,
            background:'#FFFBEE', borderRadius:8, border:'1px solid #E6D068',
          }}>
            <svg viewBox="0 0 16 16" width="13" height="13" fill="none" style={{flexShrink:0}}>
              <circle cx="8" cy="8" r="7" stroke="#C09820" strokeWidth="1.4"/>
              <rect x="7.3" y="6.8" width="1.4" height="4.4" rx=".5" fill="#C09820"/>
              <circle cx="8" cy="4.8" r=".8" fill="#C09820"/>
            </svg>
            请扫描试剂卡的条码，确认项目批次后，点击加卡
          </div>
        </div>

        {/* ── 底部按钮 ── */}
        <div className="modal-ft">
          <button className="btn" disabled={isLoading} onClick={onClose}>
            {doneCount > 0 ? '完成' : '关闭'}
          </button>

          {/* 加卡按钮 + 进度条 */}
          <div style={{position:'relative', display:'inline-flex', borderRadius:4, overflow:'hidden'}}>
            <button
              className="btn primary"
              disabled={!selected || isLoading}
              onClick={handleLoad}
              style={{minWidth:90, letterSpacing:.5, position:'relative', zIndex:1}}>
              {isLoading
                ? <span>加卡中…</span>
                : <><Icon name="check" size={11}/> 加 卡</>}
            </button>
            {isLoading && (
              <div style={{
                position:'absolute', top:0, left:0, height:'100%',
                width: progress + '%',
                background:'rgba(255,255,255,0.2)',
                transition:'width .09s linear',
                pointerEvents:'none', zIndex:2,
              }}/>
            )}
          </div>
        </div>
      </div>
    </div>
  );
};

// Alerts modal
const AlertsModal = ({ alerts, onClose, onHandle, onResetSystem, onEstop, onClearAll }) => (
  <div className="overlay">
    <div className="modal" style={{width: 620}}>
      <div className="modal-hd" style={{background: alerts.some(a=>!a.handled) ? '#C0392B' : 'var(--blue-700)'}}>
        <div><Icon name="alert" size={14}/> 报警管理</div>
        <span className="x" onClick={onClose}>×</span>
      </div>
      <div className="modal-bd" style={{padding:0}}>
        {alerts.length === 0 ? (
          <div style={{padding:40, textAlign:'center', color:'var(--ink-400)'}}>
            <Icon name="check" size={28} color="#C5D3DF"/>
            <div style={{marginTop:6, fontSize:12}}>暂无报警</div>
          </div>
        ) : (
          <table className="tbl">
            <thead><tr>
              <th style={{width:64}}>级别</th><th style={{width:130}}>时间</th><th style={{width:80}}>代码</th>
              <th>描述</th><th style={{width:80}}>状态</th><th style={{width:70}}></th>
            </tr></thead>
            <tbody>
              {alerts.map(a => (
                <tr key={a.id}>
                  <td>
                    <span className={'pill '+(a.level==='warn'?'err': a.level==='info'?'run':'warn')} style={{fontSize:10}}>
                      <span className="dot"/>{a.level==='warn'?'警告': a.level==='info'?'信息':'严重'}
                    </span>
                  </td>
                  <td className="mono" style={{fontSize:11}}>{a.time}</td>
                  <td className="mono" style={{fontSize:11}}>{a.code}</td>
                  <td style={{fontSize:12}}>{a.msg}</td>
                  <td>
                    {a.handled
                      ? <span className="pill ok"><span className="dot"/>已处理</span>
                      : <span className="pill err"><span className="dot"/>未处理</span>}
                  </td>
                  <td style={{textAlign:'right'}}>
                    {!a.handled && <button className="btn sm" onClick={()=>onHandle(a.id)}>处理</button>}
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
      <div className="modal-ft" style={{justifyContent:'space-between'}}>
        <div style={{display:'flex', gap:6}}>
          <button className="btn danger" onClick={onEstop}><Icon name="stop" size={11}/> 急停</button>
          <button className="btn warn" onClick={onResetSystem}><Icon name="reset" size={11}/> 复位</button>
          <button className="btn" onClick={onClearAll}>清除已处理</button>
        </div>
        <button className="btn primary" onClick={onClose}>关闭</button>
      </div>
    </div>
  </div>
);

// Replace consumable modal
const ReplaceModal = ({ type, consumables, onClose, onConfirm, onKeyboard, keyboardTarget, keyboardValue }) => {
  const data = consumables[type];
  const [qty, setQty] = React.useState(80);
  const [pendingQty, setPendingQty] = React.useState(80);

  const isEditing = keyboardTarget === 'replace_qty';
  const displayValue = isEditing ? (keyboardValue || '') : qty;

  const handleClickQty = () => {
    onKeyboard('sampleId', String(qty));
    setPendingQty(qty);
  };

  const handleConfirm = () => {
    const finalQty = isEditing ? (parseInt(keyboardValue) || pendingQty) : qty;
    onConfirm(finalQty);
  };

  return (
    <div className="overlay">
      <div className="modal" style={{width: 340}}>
        <div className="modal-hd">
          <div><Icon name="refresh" size={14}/> 更换耗材 — {data.name}</div>
          <span className="x" onClick={onClose}>×</span>
        </div>
        <div className="modal-bd">
          <div style={{fontSize:12, color:'var(--ink-600)', marginBottom:12, lineHeight:1.8}}>
            1. 从正面抽出托盘<br/>
            2. 取出旧 {data.name}，放入新的耗材<br/>
            3. 将托盘推回仪器并确认
          </div>
          <div className="field">
            <label style={{fontSize:11, color:'var(--ink-500)'}}>数量 (最大80)</label>
            <div
              onClick={handleClickQty}
              style={{
                height:48,
                lineHeight:'48px',
                textAlign:'center',
                fontWeight:700,
                fontSize:24,
                fontFamily:'var(--font-num)',
                background: isEditing ? 'var(--blue-050)' : 'var(--surface-sunken)',
                border:'1px solid var(--border-strong)',
                borderRadius:4,
                color:'var(--ink-800)',
                cursor:'pointer',
                userSelect:'none',
              }}
            >
              {displayValue || '点击输入'}
            </div>
            <div style={{fontSize:10, color:'var(--ink-400)', marginTop:4, textAlign:'center'}}>点击数字区域输入</div>
          </div>
        </div>
        <div className="modal-ft">
          <button className="btn" onClick={onClose}>取消</button>
          <button className="btn primary" onClick={handleConfirm}><Icon name="check" size={11}/> 确认更新</button>
        </div>
      </div>
    </div>
  );
};

// Toast
const Toast = ({ msg, type='info' }) => {
  if (!msg) return null;
  const colors = { info:'#1464A5', ok:'#2E8B57', err:'#C0392B', warn:'#D08419' };
  return (
    <div style={{
      position:'absolute', top:76, left:'50%', transform:'translateX(-50%)',
      background: colors[type], color:'#fff',
      padding:'8px 14px', borderRadius:4,
      fontSize:12, fontWeight:500,
      boxShadow:'0 4px 12px rgba(0,0,0,.2)',
      zIndex: 100,
    }}>{msg}</div>
  );
};

Object.assign(window, { AddCardModal, AlertsModal, ReplaceModal, Toast });
</script>
<script type="text/babel">// Root App — wires everything together
const { useState, useEffect, useRef, useMemo } = React;

function App() {
  // Auth
  const [user, setUser] = useState(null);

  // Navigation
  const [tab, setTab] = useState('detect');

  // Detect state
  const [slots, setSlots] = useState(INITIAL_SLOTS);
  const [activeSlotId, setActiveSlotId] = useState(null);
  const [selected, setSelected] = useState([]);
  const [view, setView] = useState('list'); // 'list' | 'form'
  const [editing, setEditing] = useState(null);

  // Keyboard
  const [kb, setKb] = useState(null); // {target, mode, value}

  // Device
  const [device, setDevice] = useState('idle'); // idle | running | paused | error
  const [temp, setTemp] = useState(37.0);
  const [tickerMsg, setTickerMsg] = useState('');

  // Consumables / cards
  const [consumables, setConsumables] = useState(INITIAL_CONSUMABLES);
  const [cards, setCards] = useState(INITIAL_CARDS);
  const [loadedCards, setLoadedCards] = useState({}); // code -> qty loaded

  // Alerts
  const [alerts, setAlerts] = useState(INITIAL_ALERTS);

  // Modals
  const [modal, setModal] = useState(null); // 'addCard' | 'alerts' | 'replace:tips' | 'replace:plate' | 'dilution:idx' | null

  // Results
  const [results] = useState(() => seedResults());

  // Toast
  const [toast, setToast] = useState(null);
  const showToast = (msg, type='info') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 2200);
  };

  // Temperature wiggle
  useEffect(() => {
    const id = setInterval(() => {
      setTemp(t => 37 + (Math.random()-.5)*.4);
    }, 2000);
    return () => clearInterval(id);
  }, []);

  // Running simulation — advance samples through states
  useEffect(() => {
    if (device !== 'running') return;
    const id = setInterval(() => {
      setSlots(prev => {
        const next = [...prev];
        // any running -> 80% chance done
        const runningIdx = next.findIndex(s => s.status === 'running');
        if (runningIdx >= 0 && Math.random() > 0.3) {
          next[runningIdx] = { ...next[runningIdx], status: 'done' };
          setTickerMsg(`样本 ${next[runningIdx].id} (${next[runningIdx].name}) 检测完成`);
          return next;
        }
        // pick a scheduled to start
        const schedIdx = next.findIndex(s => s.status === 'scheduled');
        if (schedIdx >= 0) {
          next[schedIdx] = { ...next[schedIdx], status: 'running' };
          setTickerMsg(`正在检测样本 ${next[schedIdx].id} (${next[schedIdx].name})...`);
          return next;
        }
        // all done -> stop
        if (!next.some(s => s.status === 'scheduled' || s.status === 'running')) {
          setDevice('idle');
          setTickerMsg('所有样本检测完成');
          showToast('所有样本检测完成', 'ok');
        }
        return next;
      });
    }, 2200);
    return () => clearInterval(id);
  }, [device]);

  // Pending cards calculation
  const neededByCode = useMemo(() => {
    const need = {};
    slots.forEach(s => {
      if (s.status === 'scheduled') {
        s.assays?.forEach(a => {
          need[a] = (need[a] || 0) + 1;
        });
      }
    });
    // subtract loaded
    Object.keys(loadedCards).forEach(c => {
      if (need[c]) need[c] = Math.max(0, need[c] - loadedCards[c]);
    });
    return need;
  }, [slots, loadedCards]);
  const pendingCardCount = Object.values(neededByCode).reduce((a,b)=>a+b,0);

  const scheduledCount = slots.filter(s => s.status==='scheduled').length;
  const runningCount   = slots.filter(s => s.status==='running').length;

  // Handlers
  const handleSelectSlot = (id) => {
    const slot = slots.find(s => s.id === id);
    setActiveSlotId(id);
    if (slot.status === 'empty') {
      setEditing(null);
      setView('form');
    } else {
      setView('list');
    }
  };

  const handleSubmitForm = (form) => {
    setSlots(prev => prev.map(s => s.id === activeSlotId ? {
      ...s,
      status: 'scheduled',
      sampleId: form.sampleId, name: form.name, gender: form.gender,
      age: form.age, ageUnit: form.ageUnit, type: form.type, assays: form.assays,
    } : s));
    setView('list');
    setKb(null);
    showToast(`样本 ${activeSlotId} 已编排`, 'ok');
  };

  const handleCancelForm = () => { setView('list'); setKb(null); };

  const handleToggleSelect = (id) => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);
  const handleSelectAll = (on) => {
    if (on) setSelected(slots.filter(s => s.status !== 'empty').map(s => s.id));
    else setSelected([]);
  };

  const handleDelete = () => {
    setSlots(prev => prev.map(s => selected.includes(s.id)
      ? { id: s.id, status:'empty' } : s));
    showToast(`已删除 ${selected.length} 个样本`, 'ok');
    setSelected([]);
  };

  const handleEdit = () => {
    if (selected.length !== 1) { showToast('请选择一个样本编辑', 'warn'); return; }
    const slot = slots.find(s => s.id === selected[0]);
    setActiveSlotId(slot.id);
    setEditing(slot);
    setView('form');
  };

  const handleNew = () => {
    const empty = slots.find(s => s.status === 'empty');
    if (!empty) { showToast('所有样本位已满', 'warn'); return; }
    setActiveSlotId(empty.id);
    setEditing(null);
    setView('form');
  };

  // Keyboard input handling
  const onKeyboardInput = (ch) => {
    if (!kb) return;
    if (ch === '__close' || ch === '__enter') { setKb(null); return; }
    if (ch === '__clear') {
      setKb(k => ({...k, value: ''}));
      window.__sampleFormSetValue?.(kb.target, kb.target==='age' ? '' : '');
      return;
    }
    if (ch === '__back') {
      setKb(k => {
        const v = (k.value || '').slice(0, -1);
        window.__sampleFormSetValue?.(k.target, k.target==='age' ? (parseInt(v)||'') : v);
        return {...k, value: v};
      });
      return;
    }
    setKb(k => {
      const v = (k.value || '') + ch;
      window.__sampleFormSetValue?.(k.target, k.target==='age' ? (parseInt(v)||v) : v);
      return {...k, value: v};
    });
  };

  const openKb = (target, value) => {
    const mode = (target === 'age' || target === 'sampleId') ? 'num' : 'abc';
    setKb({ target, mode, value: String(value || '') });
  };

  // Device
  const handleStart = () => {
    if (pendingCardCount > 0) {
      showToast(`仍需加载 ${pendingCardCount} 张试剂卡`, 'warn');
      setModal('addCard');
      return;
    }
    if (scheduledCount === 0) { showToast('无待检测样本', 'warn'); return; }
    setDevice('running');
    setTickerMsg('启动中... 开始样本检测流程');
    showToast('设备已启动', 'ok');
  };
  const handlePause = () => {
    setDevice('paused');
    setTickerMsg('设备已暂停');
  };

  // Add card
  const handleConfirmCards = (qtys) => {
    setLoadedCards(prev => {
      const next = {...prev};
      Object.keys(qtys).forEach(c => { next[c] = (next[c]||0) + qtys[c]; });
      return next;
    });
    setCards(prev => prev.map(c => qtys[c.code] ? {...c, remaining: c.remaining - qtys[c.code]} : c));
    // 不关闭弹窗 — 弹窗内部通过"完成"按钮自行关闭，允许连续加卡
    showToast(`已加载 ${Object.values(qtys).reduce((a,b)=>a+b,0)} 张试剂卡`, 'ok');
  };

  // Alerts
  const handleAlertHandle = (id) => {
    setAlerts(prev => prev.map(a => a.id===id ? {...a, handled:true} : a));
  };
  const handleResetSystem = () => {
    setDevice('idle');
    setAlerts(prev => prev.map(a => ({...a, handled:true})));
    showToast('系统已复位', 'ok');
  };
  const handleEstop = () => {
    setDevice('idle');
    showToast('急停已触发', 'err');
  };
  const handleClearAll = () => {
    setAlerts(prev => prev.filter(a => !a.handled));
  };

  // Consumable replace — inline (qty provided) or modal (no qty)
  const handleReplace = (type, qty) => {
    if (qty !== undefined) {
      setConsumables(prev => ({
        ...prev,
        [type]: { ...prev[type], qty, lotNo: 'NEW-'+Date.now().toString().slice(-6) },
      }));
      showToast(`${consumables[type]?.name || type}已更换`, 'ok');
    } else {
      setModal('replace:'+type);
    }
  };
  const handleConfirmReplace = (qty) => {
    const type = modal.split(':')[1];
    setConsumables(prev => ({
      ...prev,
      [type]: { ...prev[type], qty, lotNo: 'NEW-'+Date.now().toString().slice(-6) },
    }));
    setModal(null);
    showToast(`${consumables[type]?.name || type}已更换`, 'ok');
  };

  // Dilution
  const handleLoadDilution = (idx, action, data) => {
    setConsumables(prev => {
      const next = {...prev, dilutions: [...prev.dilutions]};
      if (action === 'load') {
        const cap = data && data.spec ? parseInt(data.spec) : next.dilutions[idx].capacity;
        next.dilutions[idx] = {
          ...next.dilutions[idx],
          qty: cap,
          capacity: cap,
          name: data && data.name ? data.name.toUpperCase() : next.dilutions[idx].name,
          lotNo: data && data.batch ? data.batch : next.dilutions[idx].lotNo,
          expire: data && data.expireDate ? data.expireDate : next.dilutions[idx].expire,
        };
      } else {
        next.dilutions[idx] = {...next.dilutions[idx], qty: 0};
      }
      return next;
    });
    showToast(action==='load' ? '稀释液已装载' : '稀释液已卸载', 'ok');
  };

  if (!user) return <Login onLogin={u => setUser(u.user)} />;

  return (
    <div style={{height:'100%', display:'flex', flexDirection:'column'}}>
      <TopBar
        tab={tab} onTab={setTab}
        device={device} temp={temp} message={tickerMsg}
        alerts={alerts} onAlerts={() => setModal('alerts')}
        user={user}
      />

      {tab === 'detect' && (
        <DetectPage
          slots={slots}
          activeSlotId={activeSlotId}
          onSelectSlot={handleSelectSlot}
          selected={selected}
          onToggleSelect={handleToggleSelect}
          onSelectAll={handleSelectAll}
          view={view} setView={setView}
          onSubmitForm={handleSubmitForm}
          onCancelForm={handleCancelForm}
          onEdit={handleEdit}
          onDelete={handleDelete}
          onNew={handleNew}
          onKeyboard={openKb}
          keyboardTarget={kb?.target}
          editing={editing}
          nextSeq={editing ? slots.filter(s => s.status !== 'empty').findIndex(s => s.id === editing.id) + 1 : slots.filter(s => s.status !== 'empty').length + 1}
          onRackChange={inserted => setTickerMsg(inserted ? '样本架已就位' : '样本架已取出')}
        />
      )}

      {tab === 'results' && <ResultsPage results={results}/>}

      {tab === 'consumables' && (
        <ConsumablesPage
          consumables={consumables}
          cards={cards}
          onReplace={handleReplace}
          onLoadDilution={handleLoadDilution}
        />
      )}

      {tab === 'settings' && <SettingsPage />}

      <BottomBar
        consumables={consumables}
        device={device}
        onStart={handleStart}
        onPause={handlePause}
        scheduledCount={scheduledCount}
        runningCount={runningCount}
        pendingCardCount={pendingCardCount}
        onAddCard={() => { if(pendingCardCount>0) setModal('addCard'); else showToast('无需加卡','info'); }}
        onOpenConsumable={(k) => setModal('replace:'+k)}
        onOpenDilutions={(i) => { setTab('consumables'); }}
        message={tickerMsg}
      />

      {kb && (
        <Keyboard
          mode={kb.mode}
          target={kb.target}
          value={kb.value}
          onInput={onKeyboardInput}
          onClose={() => setKb(null)}
        />
      )}

      {modal === 'addCard' && (
        <AddCardModal
          cards={cards}
          neededByCode={Object.fromEntries(Object.entries(neededByCode).filter(([,v])=>v>0))}
          onClose={() => setModal(null)}
          onConfirm={handleConfirmCards}
        />
      )}

      {modal === 'alerts' && (
        <AlertsModal
          alerts={alerts}
          onClose={() => setModal(null)}
          onHandle={handleAlertHandle}
          onResetSystem={handleResetSystem}
          onEstop={handleEstop}
          onClearAll={handleClearAll}
        />
      )}

      {modal && modal.startsWith('replace:') && (
        <ReplaceModal
          type={modal.split(':')[1]}
          consumables={consumables}
          onClose={() => setModal(null)}
          onConfirm={handleConfirmReplace}
          onKeyboard={openKb}
          keyboardTarget={kb?.target}
          keyboardValue={kb?.value}
        />
      )}

      {toast && <Toast msg={toast.msg} type={toast.type}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('stage')).render(<App/>);
</script>
</body></html>
